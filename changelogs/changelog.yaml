      release_summary: Added support for Flight Control API v0.8.0.
    fragments:
    - flightctl_1.1.0_update.yml
    release_date: '2025-06-25'
  1.2.0:
    changes:
      minor_changes:
      - Updated the Ansible collection to support Flight Control API version 0.9.0.
      - Version bump for Automation Hub publishing
      release_summary: Added support for Flight Control API v0.9.0.
    fragments:
    - flightctl_1.2.0_update.yml
    release_date: '2025-08-14'
  1.3.0:
    changes:
      bugfixes:
      - Inventory plugin now sends Authorization headers explicitly for list operations,
        resolving authentication failures when the client library does not auto-attach
        tokens.
      - Remove noisy warning when no configuration file is provided; plugin proceeds
        quietly without a config file.
      - Treat `host` as a string (not a path) to prevent URLs from being coerced into
        file paths, fixing "No host specified" errors.
      minor_changes:
      - Added `hostnames` option for selecting the device field (dot path) as the
        inventory hostname.
      - Added support for Basic auth (username/password) in the inventory plugin for
        environments with proxies that accept HTTP Basic.
      - Improved documentation and examples for `flightctl_config_file` (FlightCtl
        config) and config precedence.
      - Inventory plugin now supports `group_by` option for grouping devices by a
        field value.
      - Updated the Ansible collection to support Flight Control API version 0.10.0.
      release_summary: Added support for Flight Control API v0.10.0 and improved the
        FlightCtl inventory plugin robustness.
    fragments:
    - flightctl_1.3.0_update.yml
    release_date: '2025-09-30'
  1.4.0:
    changes:
      major_changes:
      - Added support for new features in Flight Control API v1.0.
      - Updated the Ansible collection to support Flight Control API version 1.0.
      release_summary: Added support for Flight Control API v1.0.
    fragments:
    - flightctl_1.4.0_update.yml
    release_date: '2025-12-21'
  1.5.0:
    changes:
      major_changes:
      - Added ``flightctl_image_builder`` and ``flightctl_image_builder_info`` modules.
      - Added support for AuthProvider, Catalog, CatalogItem, Event, Organization,
        and EnrollmentConfig resource types.
      - Added v1alpha1 API support for Catalog and CatalogItem resources.
      - Updated the Ansible collection to support Flight Control API version 1.1.
      release_summary: Added Image Builder modules, v1alpha1 API support, and new
        resource types for Flight Control API v1.1.
    fragments:
    - flightctl_1.5.0_update.yml
    modules:
    - description: Manage Flight Control Image Builder resources.
      name: flightctl_image_builder
      namespace: ''
    - description: Get information about Flight Control Image Builder resources.
      name: flightctl_image_builder_info
      namespace: ''
    release_date: '2026-04-06'
  1.6.0:
    changes:
      major_changes:
      - Updated the Ansible collection to support Flight Control API version 1.2.
      release_summary: Added support for Flight Control API v1.2.
    fragments:
    - flightctl_1.6.0_update.yml
    release_date: '2026-06-22'
  1.6.1:
    changes:
      bugfixes:
      - Added a pydantic ``ValidationError`` fallback in the inventory plugin that
        retries device list calls using raw JSON endpoints, fixing crashes when the
        API returns mount-only application volumes without the required ``image``
        field.
      - Added missing ``env`` declarations to all inventory plugin connection options
        so that environment variables (``FLIGHTCTL_TOKEN``, ``FLIGHTCTL_HOST``, etc.)
        are no longer silently ignored by ``get_option()``, restoring AAP Credential
        Type injection support.
      - Deferred ``jsonschema`` and ``pyyaml`` import checks in ``ConfigLoader`` to
        ``_load_config_file()`` so that the inventory plugin no longer raises ``ImportError``
        when these packages are absent and no config file is used.
      - Replaced broken HTTP Basic Auth with an OIDC Resource Owner Password Grant
        flow in the inventory plugin, matching the ``flightctl`` CLI behavior and
        fixing authentication against RHEM servers that only accept Bearer tokens.
      release_summary: Bug fix release addressing inventory plugin crashes and authentication
        issues.
    fragments:
    - flightctl_1.6.1_bugfixes.yml
    release_date: '2026-08-13'
  1.7.0:
    changes:
      bugfixes:
      - Added a pydantic ``ValidationError`` fallback to the shared API module (``module_utils/api_module.py``)
        so that ``get()`` and ``list()`` retry against the client SDK's raw JSON endpoints
        instead of crashing. This fixes unhandled tracebacks in ``flightctl_resource_info``
        and other modules when the API returns mount-only application volumes without
        the required ``image`` field, matching the fix previously applied to the inventory
        plugin. The pydantic-detection helper is now shared via ``module_utils/sdk_utils.py``.
      - Replaced broken HTTP Basic Auth with an OIDC Resource Owner Password Grant
        flow in the shared API module (``module_utils/api_module.py``) and the image
        builder module (``module_utils/imagebuilder_module.py``). Modules such as
        ``flightctl_resource``, ``flightctl_resource_info``, ``flightctl_certificate_management``,
        ``flightctl_enrollment_config_info`` and the image builder modules now authenticate
        with a Bearer token when given ``username``/``password``, fixing authentication
        against Flight Control servers that only accept OIDC. This matches the fix
        previously applied to the inventory plugin. The OIDC discovery and password-grant
        logic is now shared via ``module_utils/oidc_auth.py``.
      major_changes:
      - Updated the Ansible collection to support Flight Control API version 1.3.
      minor_changes:
      - Added the ``deployments`` option to ``flightctl_resource_info`` for querying
        the device and fleet deployments of a named ``CatalogItem``.
      - Added the ``flightctl_application`` module to start, stop, and restart applications
        on Devices and Fleets.
      - Updated collection requirements to install ``flightctl-client==1.3.0`` from
        PyPI instead of the client repository's ``main`` branch.
      release_summary: Added support for Flight Control API v1.3.
    fragments:
    - edm-5200-oidc-auth-module-utils.yml
    - edm-5201-api-module-pydantic-fallback.yml
    - edm-5484-flightctl-client-pypi.yml
    - edm-5485-flightctl-application.yml
    - edm-5486-catalog-item-deployments.yml
    - flightctl_1.7.0_api_1.3.yml
    modules:
    - description: Start, stop, or restart Flight Control applications.
      name: flightctl_application
      namespace: ''
    release_date: '2026-09-07'
